steps:
  # ── Build Worker only (API image already pushed) ─────────────────────────
  - name: "gcr.io/cloud-builders/docker"
    id: build-worker
    args:
      - build
      - -f
      - Dockerfile.worker
      - -t
      - us-central1-docker.pkg.dev/aegis-live-488416/blast-radius/worker:latest
      - .

  - name: "gcr.io/cloud-builders/docker"
    id: push-worker
    waitFor: [build-worker]
    args:
      - push
      - us-central1-docker.pkg.dev/aegis-live-488416/blast-radius/worker:latest

images:
  - us-central1-docker.pkg.dev/aegis-live-488416/blast-radius/worker:latest

options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY
  env:
    - DOCKER_BUILDKIT=1

timeout: "1800s"
